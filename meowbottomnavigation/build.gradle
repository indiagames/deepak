apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'maven-publish'

def library_groupId = 'com.etebarian'
def library_artifactId = 'meow-bottom-navigation'
def library_versionCode = 1_0_01_00_02
def library_versionName = '1.0.2'

android {
    compileSdkVersion compileSdk_version

    defaultConfig {
        minSdkVersion minSdk_version
        targetSdkVersion targetSdk_version
        versionCode library_versionCode
        versionName library_versionName

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

androidExtensions {
    experimental = true
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.0.2"
    implementation "androidx.core:core-ktx:1.0.1"
}

// Published artifact configuration for older AGP versions (AGP < 3.6.0)
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = library_groupId
                artifactId = library_artifactId
                version = library_versionName

                // Explicitly attach the generated AAR file
                artifact("$buildDir/outputs/aar/${project.getName()}-release.aar")

                // Generate pom.xml dependencies automatically so transitive dependencies are preserved
                pom.withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    configurations.implementation.allDependencies.each { dependency ->
                        if (dependency.group != null && dependency.name != null) {
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', dependency.group)
                            dependencyNode.appendNode('artifactId', dependency.name)
                            dependencyNode.appendNode('version', dependency.version)
                        }
                    }
                }
            }
        }
    }
}

// Ensures the AAR is built before publishing task runs
tasks.matching { it.name.startsWith('publish') }.all {
    dependsOn tasks.named("bundleReleaseAar")
}
